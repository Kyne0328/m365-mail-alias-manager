services:
  - type: web
    name: m365-mail-alias-manager-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: API_AUDIENCE
        sync: false
      - key: API_SCOPE
        value: access_as_user
      - key: ALLOWED_ORIGINS
        value: https://m365-mail-alias-manager.onrender.com
      - key: PUBLIC_APP_URL
        value: https://m365-mail-alias-manager.onrender.com
      - key: EXCHANGE_CERTIFICATE_BASE64
        sync: false
      - key: EXCHANGE_CERTIFICATE_PASSWORD
        sync: false
